<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

  <!-- =====================================================
       HOMEPAGE UI — password eye + lots scroll
       ===================================================== -->

  <script>
    (function () {

      var pass = document.getElementById('password');
      var eye = document.getElementById('toggle-password');

      if (pass && eye) {
        eye.addEventListener('click', function () {
          var shown = pass.type === 'text';
          pass.type = shown ? 'password' : 'text';
          eye.setAttribute(
            'aria-pressed',
            String(!shown)
          );
          eye.setAttribute(
            'aria-label',
            shown ? 'Показать пароль' : 'Скрыть пароль'
          );
          eye.classList.toggle(
            'is-open',
            !shown
          );
        });
      }

      var track =
        document.getElementById('homepage-lots-grid');

      var next =
        document.getElementById('homepage-lots-next');

      if (track && next) {
        next.addEventListener('click', function () {
          var end =
            track.scrollLeft + track.clientWidth >=
            track.scrollWidth - 4;

          track.scrollBy({
            left: end
              ? -track.scrollWidth
              : track.clientWidth * 0.8,
            behavior: 'smooth'
          });
        });
      }

    })();
          /*
       * MOBILE DEMO LOTS
       * Начинаем со второго "шага",
       * чтобы можно было двигаться и влево, и вправо.
       */
      var lotsContainer =
        document.querySelector('.homepage-demo-lots');

      if (lotsContainer) {

        function setMobileLotsPosition() {
          if (window.innerWidth <= 767) {

            /*
             * Один лот = 285px.
             * Начинаем примерно с середины первого левого запаса.
             */
            lotsContainer.scrollLeft = 570;

          } else {

            lotsContainer.scrollLeft = 0;

          }
        }

        window.addEventListener(
          'load',
          setMobileLotsPosition
        );

        window.addEventListener(
          'resize',
          setMobileLotsPosition
        );

        /*
         * Дополнительный запуск после инициализации переводов.
         */
        setTimeout(
          setMobileLotsPosition,
          300
        );
      }
  </script>
